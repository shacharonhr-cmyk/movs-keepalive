name: Keep MOVS awake

# Free Render services sleep after ~15 minutes without traffic. Pinging the public
# /health endpoint keeps the addon responsive and lets its daily jobs run.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --fail --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://movs-5mx8.onrender.com/health
