name: Stay active

# GitHub pauses scheduled workflows in repos with no activity for 60 days.
# A tiny monthly commit keeps the ping schedule running.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > last-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-active.txt
          git commit -m "Monthly keep-alive"
          git push
